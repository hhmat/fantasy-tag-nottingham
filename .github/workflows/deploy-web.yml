# Deploy the Expo web build to GitHub Pages.
# Requires repo secrets: EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY
# and (once) Settings → Pages → Source = "GitHub Actions".
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      # Gate 1: type errors fail the build before anything ships
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Export static web build
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          # Subpath the site is served from — must match the repo name
          EXPO_BASE_URL: /${{ github.event.repository.name }}

      # Gate 2: smoke-check the exported bundle. Catches the two failure
      # modes we've hit in production: missing env (app boots with no
      # backend) and a broken/missing JS bundle (blank page).
      - name: Smoke-check export
        run: |
          test -f dist/index.html || { echo "FAIL: dist/index.html missing"; exit 1; }
          BUNDLE=$(grep -oE 'src="[^"]+\.js"' dist/index.html | head -1 | sed 's/src="//;s/"//')
          test -n "$BUNDLE" || { echo "FAIL: no JS bundle referenced in index.html"; exit 1; }
          BUNDLE_PATH="dist/${BUNDLE#/}"
          BUNDLE_PATH="${BUNDLE_PATH#dist/${EXPO_BASE_URL#/}/}"
          test -f "$BUNDLE_PATH" || BUNDLE_PATH="dist/_expo/static/js/web/$(basename "$BUNDLE")"
          test -f "$BUNDLE_PATH" || { echo "FAIL: bundle $BUNDLE not found in dist"; exit 1; }
          grep -q "${EXPO_PUBLIC_SUPABASE_URL#https://}" "$BUNDLE_PATH" \
            || { echo "FAIL: Supabase URL not baked into bundle (env missing at export time)"; exit 1; }
          grep -q "sb_publishable" "$BUNDLE_PATH" \
            || { echo "FAIL: Supabase anon key not baked into bundle"; exit 1; }
          echo "Smoke check passed: $BUNDLE_PATH"
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}

      - name: SPA fallback (deep links)
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
